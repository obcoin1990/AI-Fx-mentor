[build]
builder = "dockerfile"
dockerfile = "./Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"uvicorn main:app --host 0.0.0.0 --port $PORT\""
healthcheckPath = "/health"
healthcheckTimeout = 30

[[services]]
name = "backend"
dockerfilePath = "./Dockerfile"
rootDirectory = "."

[[services.variables]]
name = "PYTHONUNBUFFERED"
value = "1"
